name: PR Title

# Validates that the pull-request title follows Conventional Commits. Because
# PRs are squash-merged, the PR title becomes the commit on main that
# release-please parses, so a valid title is what drives the changelog/version.
on:
  pull_request:
    types:
      - opened
      - edited
      - reopened
      - synchronize

permissions:
  pull-requests: read

jobs:
  conventional-title:
    name: Conventional Commits
    runs-on: ubuntu-latest
    if: github.event.pull_request.user.login != 'github-actions[bot]'
    steps:
      - uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # Keep in sync with release-please-config.json changelog-sections.
          types: |
            feat
            fix
            perf
            refactor
            docs
            chore
            style
            test
            build
            ci
